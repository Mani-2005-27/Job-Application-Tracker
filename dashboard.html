<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Application Tracker</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 25px 50px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 7px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
        }

        .add-btn {
            background: #2563eb;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .form {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form h2 {
            margin-bottom: 20px;
        }

        .group {
            margin-bottom: 15px;
        }

        .group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .group input,
        .group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
        }

        .save {
            background: #16a34a;
        }

        .cancel {
            background: #6b7280;
            margin-left: 5px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
        }

        .applications {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .job {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 18px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .job h3 {
            margin-bottom: 10px;
        }

        .job p {
            margin: 6px 0;
        }

        .edit {
            background: #2563eb;
            margin-top: 10px;
        }

        .delete {
            background: #dc2626;
            margin-left: 5px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media(max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 500px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .top {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .header {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

    <header class="header">

        <h1>Job Application Tracker</h1>

        <p>Track your job applications in one place</p>

    </header>


    <main class="container">

        <div class="top">

            <h2>Dashboard</h2>

            <button class="add-btn" onclick="showAddForm()">
                + Add Job Application
            </button>

        </div>


        <!-- FORM -->

        <div class="form" id="jobForm">

            <h2 id="formTitle">
                Add New Job Application
            </h2>


            <div class="group">

                <label>Company Name</label>

                <input
                    type="text"
                    id="company"
                    placeholder="Enter company name">

            </div>


            <div class="group">

                <label>Job Role</label>

                <input
                    type="text"
                    id="role"
                    placeholder="Enter job role">

            </div>


            <div class="group">

                <label>Applied Date</label>

                <input
                    type="date"
                    id="date">

            </div>


            <div class="group">

                <label>Status</label>

                <select id="status">

                    <option value="Applied">Applied</option>

                    <option value="Interview">Interview</option>

                    <option value="Selected">Selected</option>

                    <option value="Rejected">Rejected</option>

                </select>

            </div>


            <button
                class="save"
                id="saveButton"
                onclick="saveOrUpdate()">

                Save Application

            </button>


            <button
                class="cancel"
                onclick="hideForm()">

                Cancel

            </button>

        </div>


        <!-- CARDS -->

        <div class="cards">

            <div class="card">

                <h3>Applied Jobs</h3>

                <p id="appliedCount">0</p>

            </div>


            <div class="card">

                <h3>Interviews</h3>

                <p id="interviewCount">0</p>

            </div>


            <div class="card">

                <h3>Selected</h3>

                <p id="selectedCount">0</p>

            </div>


            <div class="card">

                <h3>Rejected</h3>

                <p id="rejectedCount">0</p>

            </div>

        </div>


        <!-- APPLICATIONS -->

        <div class="applications">

            <h2>My Applications</h2>

            <div id="jobList"></div>

        </div>

    </main>


<script>

const API_URL = "http://localhost:3000";

let editingId = null;


/* =========================
   TODAY DATE
========================= */

function getTodayDate() {

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
        today.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        today.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================
   SHOW ADD FORM
========================= */

function showAddForm() {

    editingId = null;

    document.getElementById("formTitle").textContent =
        "Add New Job Application";

    document.getElementById("saveButton").textContent =
        "Save Application";

    document.getElementById("company").value = "";

    document.getElementById("role").value = "";

    document.getElementById("date").value =
        getTodayDate();

    document.getElementById("status").value =
        "Applied";

    document.getElementById("jobForm").style.display =
        "block";

}


/* =========================
   HIDE FORM
========================= */

function hideForm() {

    editingId = null;

    document.getElementById("jobForm").style.display =
        "none";

    document.getElementById("company").value = "";

    document.getElementById("role").value = "";

    document.getElementById("date").value = "";

    document.getElementById("status").value =
        "Applied";

}


/* =========================
   SAVE OR UPDATE
========================= */

async function saveOrUpdate() {

    const company =
        document.getElementById("company").value.trim();

    const role =
        document.getElementById("role").value.trim();

    const date =
        document.getElementById("date").value;

    const status =
        document.getElementById("status").value;


    if (!company || !role || !date) {

        alert("Please fill all fields");

        return;

    }


    const applicationData = {

        company: company,

        role: role,

        applied_date: date,

        status: status

    };


    try {

        let response;


        /* UPDATE */

        if (editingId !== null) {

            response = await fetch(
                API_URL + "/applications/" + editingId,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(applicationData)
                }
            );

        }


        /* ADD */

        else {

            response = await fetch(
                API_URL + "/applications",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(applicationData)
                }
            );

        }


        const data = await response.json();


        if (data.success) {

            alert(
                editingId !== null
                    ? "Application updated successfully!"
                    : "Job Application Added!"
            );

            hideForm();

            loadApplications();

        }

        else {

            alert(
                data.message ||
                "Operation failed"
            );

        }

    }

    catch (error) {

        console.error(error);

        alert("Cannot connect to server");

    }

}


/* =========================
   LOAD APPLICATIONS
========================= */

async function loadApplications() {

    try {

        const response = await fetch(
            API_URL + "/applications"
        );


        const data = await response.json();


        if (!data.success) {

            alert("Cannot load applications");

            return;

        }


        const applications =
            data.applications || [];


        /* COUNTS */

        let applied = 0;

        let interview = 0;

        let selected = 0;

        let rejected = 0;


        applications.forEach(job => {

            const status =
                String(job.status).toLowerCase();


            if (status === "applied")
                applied++;


            if (status === "interview")
                interview++;


            if (status === "selected")
                selected++;


            if (status === "rejected")
                rejected++;

        });


        document.getElementById(
            "appliedCount"
        ).textContent = applied;


        document.getElementById(
            "interviewCount"
        ).textContent = interview;


        document.getElementById(
            "selectedCount"
        ).textContent = selected;


        document.getElementById(
            "rejectedCount"
        ).textContent = rejected;


        /* JOB LIST */

        const jobList =
            document.getElementById("jobList");


        jobList.innerHTML = "";


        if (applications.length === 0) {

            jobList.innerHTML = `
                <div class="empty">
                    No job applications added yet.
                </div>
            `;

            return;

        }


        applications.forEach(job => {

            let date = job.applied_date || "";

            if (date) {

                date = date.substring(0, 10);

            }


            const status =
                String(job.status || "");


            const jobDiv =
                document.createElement("div");


            jobDiv.className = "job";


            jobDiv.innerHTML = `

                <h3>${job.company}</h3>

                <p>
                    <strong>Role:</strong>
                    ${job.role}
                </p>

                <p>
                    <strong>Applied Date:</strong>
                    ${date}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${status}
                </p>

                <button
                    class="edit"
                    onclick="editJob(${job.id})">

                    Edit

                </button>

                <button
                    class="delete"
                    onclick="deleteJob(${job.id})">

                    Delete

                </button>

            `;


            jobList.appendChild(jobDiv);

        });

    }

    catch (error) {

        console.error(
            "Load error:",
            error
        );

        alert("Cannot connect to server");

    }

}


/* =========================
   EDIT
========================= */

async function editJob(id) {

    try {

        const response =
            await fetch(
                API_URL + "/applications"
            );


        const data =
            await response.json();


        const job =
            data.applications.find(
                item =>
                    Number(item.id) === Number(id)
            );


        if (!job) {

            alert("Application not found");

            return;

        }


        editingId = id;


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Job Application";


        document.getElementById(
            "saveButton"
        ).textContent =
            "Update Application";


        document.getElementById(
            "company"
        ).value =
            job.company;


        document.getElementById(
            "role"
        ).value =
            job.role;


        document.getElementById(
            "date"
        ).value =
            job.applied_date.substring(0, 10);


        document.getElementById(
            "status"
        ).value =
            job.status;


        document.getElementById(
            "jobForm"
        ).style.display =
            "block";


        document.getElementById(
            "jobForm"
        ).scrollIntoView({
            behavior: "smooth"
        });

    }

    catch (error) {

        console.error(error);

        alert("Cannot connect to server");

    }

}


/* =========================
   DELETE
========================= */

async function deleteJob(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this application?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL + "/applications/" + id,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            alert(
                "Application deleted successfully!"
            );

            loadApplications();

        }

        else {

            alert(
                data.message ||
                "Delete failed"
            );

        }

    }

    catch (error) {

        console.error(error);

        alert("Cannot connect to server");

    }

}


/* =========================
   START
========================= */

loadApplications();

</script>

</body>

</html>
